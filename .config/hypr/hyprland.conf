# --- MONITOR ---
monitor=,preferred,auto,1

# --- AUTOSTART ---
exec-once = waybar

# --- ENVIRONMENT VARIABLES (VMware & Wayland fixes) ---
env = XCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1

# --- VARIABLES ---
$terminal = kitty
$fileManager = kitty -e yazi
$editor = kitty -e nvim
$menu = rofi -show drun -theme ~/.config/rofi/config.rasi

# --- LOOK AND FEEL ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    
    # Orange-hued black for active borders, ultra-dark gray/black for inactive
    col.active_border = rgba(2E1505ff) 
    col.inactive_border = rgba(050505aa) 
    
    layout = dwindle
}

decoration {
    rounding = 0 # Sharp corners
    drop_shadow = false # No shadows
    
    blur {
        enabled = false # NO blur
    }
}

animations {
    enabled = false # NO animations. Windows snap instantly.
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(000000)
}

# --- KEYBINDS ---
$mainMod = SUPER

# Application Binds
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, N, exec, $editor
bind = $mainMod, Space, exec, $menu

# Window Management
bind = $mainMod, Q, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, V, togglefloating, 
bind = $mainMod, F, fullscreen,

# Workspace bindings (1-4)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4